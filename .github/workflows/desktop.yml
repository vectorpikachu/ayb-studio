name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\electron-cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
      - name: Typecheck
        run: npm run typecheck
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Prepare standalone server
        run: npm run desktop:prepare
      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ayb-windows-x64
          path: release/*.exe
          if-no-files-found: error

  macos:
    name: macOS disk image
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Prepare standalone server
        run: npm run desktop:prepare
      - name: Package macOS disk image
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload macOS disk image
        uses: actions/upload-artifact@v4
        with:
          name: ayb-macos
          path: release/*.dmg
          if-no-files-found: error
